version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aquaflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaflow -d aquaflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Статичные страницы (privacy/terms/consent/contacts) и футер пекут
        # process.env.LEGAL_* в HTML на этапе next build — значения приходят
        # из .env проекта (в git НЕ попадают, см. .gitignore .env.*).
        LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
        LEGAL_OPERATOR_SHORT: ${LEGAL_OPERATOR_SHORT:-}
        LEGAL_OGRNIP: ${LEGAL_OGRNIP:-}
        LEGAL_INN: ${LEGAL_INN:-}
        LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
        LEGAL_BANK_ACCOUNT: ${LEGAL_BANK_ACCOUNT:-}
        LEGAL_BANK_NAME: ${LEGAL_BANK_NAME:-}
        LEGAL_BIK: ${LEGAL_BIK:-}
        LEGAL_PHONE: ${LEGAL_PHONE:-}
        LEGAL_EMAIL: ${LEGAL_EMAIL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres-data:
  redis-data: